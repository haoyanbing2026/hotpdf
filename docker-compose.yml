
services:

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      FEEDBACK_ADMIN_TOKEN: "${FEEDBACK_ADMIN_TOKEN:?Please configure FEEDBACK_ADMIN_TOKEN in .env}"
      FEEDBACK_DB_PATH: "/data/hotpdf_feedback.sqlite3"
    volumes:
      - hotpdf_feedback_data:/data

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  hotpdf_feedback_data:
